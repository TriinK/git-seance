[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-seance"
version = "0.1.0"
description = "Ask the ghosts in your git history: a local Gemma model tells the story behind any line of legacy code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["ollama>=0.4"]
keywords = ["git", "gemma", "ollama", "legacy-code", "open-source-ai", "hacktoberfest"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
seance = "seance.cli:main"

[tool.setuptools]
packages = ["seance"]
